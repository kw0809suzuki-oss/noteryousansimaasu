<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ノート量産します｜編集室</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color-scheme:light;background:#f7f8fa;color:#17212b}
*{box-sizing:border-box}body{margin:0}.wrap{max-width:1000px;margin:auto;padding:22px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:1.45rem;margin:0}p{line-height:1.65}.muted{color:#677381;font-size:.9rem}
button,.file{display:inline-flex;align-items:center;gap:4px;background:#fff;border:1px solid #cbd4de;border-radius:10px;padding:10px 14px;cursor:pointer;font:inherit}
button:hover,.file:hover{background:#f0f4f8}.file input{display:none}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
.stats{background:white;border:1px solid #e1e6ed;border-radius:14px;padding:14px;margin:16px 0}
.layout{display:grid;grid-template-columns:minmax(200px,1fr) minmax(0,2fr);gap:16px}
.panel{background:white;border:1px solid #e1e6ed;border-radius:14px;padding:15px;min-width:0}
#list{display:grid;gap:8px}.item{display:block;text-align:left;width:100%;white-space:normal}
.item.active{background:#e8f2ff;border-color:#4b87d5}h2{font-size:1.2rem;line-height:1.5}
.article-body{line-height:1.9;overflow-wrap:anywhere;margin:18px 0}.article-body p{margin:0 0 1.2em;white-space:pre-wrap}.article-body h2{font-size:1.14rem;margin:1.9em 0 .7em;padding-bottom:.35em;border-bottom:1px solid #e1e6ed}.article-body h3{font-size:1.04rem;margin:1.5em 0 .5em}.article-body ul{padding-left:1.4em;line-height:1.9}
.tag{display:inline-block;background:#eef1f5;border-radius:6px;padding:3px 7px;margin:3px;font-size:.8rem}
.actions{display:flex;gap:8px;flex-wrap:wrap}
@media(max-width:680px){.layout{grid-template-columns:1fr}.wrap{padding:14px}}
</style></head>
<body><div class="wrap">
<header><div><h1>ノート量産します</h1><p class="muted">記事の下書きを見て、選んで、コピーする編集室</p></div>
<div class="toolbar"><button id="reload">再読み込み</button><label class="file">JSONを読み込む<input id="file" type="file" accept=".json,application/json"></label></div></header>
<div class="stats" id="stats">記事ファイルを読み込み中…</div>
<div class="layout"><section class="panel"><strong>記事一覧</strong><div id="list" style="margin-top:12px"></div></section>
<article class="panel"><p class="muted" id="position">記事を選択してください</p><h2 id="title">まだ記事がありません</h2><p id="summary" class="muted"></p><div id="tags"></div>
<div class="actions"><button id="copy" disabled>題名・本文・タグをコピー</button><button id="copyBody" disabled>本文のみコピー</button><button id="approve" disabled>確認済みにする（この端末のみ）</button></div>
<div id="body" class="article-body"></div></article></div>
<p class="muted">確認済み表示はこのブラウザだけに保存されます。noteへは自動投稿しません。公開前に事実・著作権・重複を確認してください。</p>
</div><script>
let articles=[],selected=-1,identity="";
const $=id=>document.getElementById(id);
function reviewedKey(i){return "review:"+identity+":"+articles[i].id}
function reviewed(i){return localStorage.getItem(reviewedKey(i))==="yes"}
function renderArticle(markdown){
 const root=$("body");root.replaceChildren();
 const lines=String(markdown||"").replace(/\r/g,"").split("\n");
 let block=[],list=null;
 function paragraph(){if(!block.length)return;const p=document.createElement("p");p.textContent=block.join("\n");root.append(p);block=[]}
 function flushList(){list=null}
 for(const line of lines){
   const t=line.trim();
   if(!t){paragraph();flushList();continue}
   const heading=t.match(/^(#{1,3})\s+(.+)$/);
   if(heading){paragraph();flushList();const h=document.createElement(heading[1].length===1?"h2":heading[1].length===2?"h2":"h3");h.textContent=heading[2];root.append(h);continue}
   const item=t.match(/^[-*]\s+(.+)$/);
   if(item){paragraph();if(!list){list=document.createElement("ul");root.append(list)}const li=document.createElement("li");li.textContent=item[1];list.append(li);continue}
   flushList();block.push(line);
 }
 paragraph();
}
function render(){
  $("stats").textContent="全 "+articles.length+" 本 ／ 確認済み "+articles.filter((_,i)=>reviewed(i)).length+" 本";
  $("list").replaceChildren();
  articles.forEach((a,i)=>{
    const b=document.createElement("button");b.className="item"+(selected===i?" active":"");
    b.textContent=(reviewed(i)?"✓ ":"")+(i+1)+". "+a.title;
    b.onclick=()=>{selected=i;render()};$("list").append(b);
  });
  const a=articles[selected];
  $("position").textContent=a?(selected+1)+" / "+articles.length:"記事を選択してください";
  $("title").textContent=a?.title||"まだ記事がありません";
  $("summary").textContent=a?.summary||"";
  renderArticle(a?.body||"");
  $("tags").replaceChildren();
  (a?.tags||[]).forEach(tag=>{const s=document.createElement("span");s.className="tag";s.textContent="#"+tag;$("tags").append(s)});
  for(const id of ["copy","copyBody","approve"])$(id).disabled=!a;
  $("approve").textContent=a&&reviewed(selected)?"確認済みを取り消す":"確認済みにする（この端末のみ）";
}
function useData(data){
 if(!data||!Array.isArray(data.articles))throw Error("articles配列がありません");
 articles=data.articles.filter(a=>a&&typeof a.title==="string"&&typeof a.body==="string");
 identity=String(data.generated_at||"import");selected=articles.length?0:-1;render();
}
async function load(){try{const r=await fetch("articles.json",{cache:"no-store"});if(!r.ok)throw Error("articles.json がまだありません");useData(await r.json())}catch(e){articles=[];selected=-1;render();$("stats").textContent=e.message+"。生成後に再読み込みするか、JSONファイルを選んでください。"}}
$("reload").onclick=load;
$("file").onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{useData(JSON.parse(await f.text()))}catch(err){alert("読み込みエラー: "+err.message)}};
async function copyText(value){try{await navigator.clipboard.writeText(value);alert("コピーしました")}catch{alert("コピーできませんでした。HTTPS環境で開いてください。")}}
$("copy").onclick=()=>{const a=articles[selected];if(a)copyText(a.title+"\n\n"+a.body+"\n\n"+a.tags.map(t=>"#"+t).join(" "))};
$("copyBody").onclick=()=>{const a=articles[selected];if(a)copyText(a.body)};
$("approve").onclick=()=>{const k=reviewedKey(selected);reviewed(selected)?localStorage.removeItem(k):localStorage.setItem(k,"yes");render()};
load();
</script></body></html>
