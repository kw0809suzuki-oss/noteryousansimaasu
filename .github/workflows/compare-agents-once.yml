name: mini-SWE-agent stable LiteLLM one-time comparison

on:
  push:
    branches:
      - experiment/note-to-field-agent-v01
    paths:
      - comparisons/launch-mini-pinned-20261023.txt

permissions:
  contents: read

jobs:
  compare:
    if: "github.event.head_commit.message == 'experiment: mini stable LiteLLM once 2026-10-23'"
    strategy:
      fail-fast: false
      matrix:
        agent: [mini-pinned]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install selected existing agent
        env:
          AGENT: ${{ matrix.agent }}
        run: |
          if [ "$AGENT" = "aider-guided" ]; then
            python -m pip install -q --disable-pip-version-check aider-chat
          else
            python -m pip install -q --disable-pip-version-check mini-swe-agent 'litellm==1.105.1'
          fi
      - name: Prepare identical, isolated repository copies
        run: |
          mkdir -p "$RUNNER_TEMP/work" "$RUNNER_TEMP/report"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/work"
          cd "$RUNNER_TEMP/work"
          git init -q
          git config user.name 'Trial Baseline'
          git config user.email 'baseline@example.invalid'
          git add -A && git commit -qm 'Unmodified trial baseline'
      - name: Single bounded agent run
        env:
          AGENT: ${{ matrix.agent }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MSWEA_CONFIGURED: "1"
          MSWEA_MODEL_RETRY_STOP_AFTER_ATTEMPT: "2"
          MSWEA_GLOBAL_CALL_LIMIT: "7"
          MSWEA_GLOBAL_COST_LIMIT: "0.03"
          AIDER_ANALYTICS_DISABLE: "true"
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then echo "No API secret. Aborting before model call."; exit 2; fi
          cd "$RUNNER_TEMP/work"
          START="$(date +%s)"
          set +e
          if [ "$AGENT" = "aider-guided" ]; then
            timeout --kill-after=8s 200s aider --model gpt-4o-mini --yes --no-auto-commits --no-auto-lint --no-auto-test --no-stream --message-file comparisons/shared-task-20261023.txt field_agent.py tests/test_field_agent.py > "$RUNNER_TEMP/report/raw.log" 2>&1
          else
            timeout --kill-after=8s 200s mini -m openai/gpt-4o-mini -y --exit-immediately -t "$(cat comparisons/shared-task-20261023.txt)" -c mini.yaml -c agent.step_limit=7 -c agent.wall_time_limit_seconds=185 -c agent.cost_limit=0.03 -o "$RUNNER_TEMP/report/mini-traj.json" > "$RUNNER_TEMP/report/raw.log" 2>&1
          fi
          RESULT="$?"
          set -e
          echo "runner_exit_code=$RESULT" >> "$RUNNER_TEMP/report/runner-status.txt"
          echo "runner_elapsed_seconds=$(($(date +%s)-START))" >> "$RUNNER_TEMP/report/runner-status.txt"
          python - <<'PY'
          from pathlib import Path
          import os, re
          root=Path(os.environ['RUNNER_TEMP'])/'report'
          raw=(root/'raw.log').read_text(encoding='utf-8',errors='replace')
          key=os.environ.get('OPENAI_API_KEY','')
          if key: raw=raw.replace(key,'[REDACTED]')
          raw=re.sub(r'sk-[A-Za-z0-9_-]{16,}', '[REDACTED]', raw)
          (root/'agent-log-redacted.txt').write_text(raw[-30000:],encoding='utf-8')
          (root/'raw.log').unlink()
          print("Agent execution recorded; no raw unredacted logs uploaded.")
          PY
      - name: Evaluate candidate on independent observed cases, without API
        if: always()
        env:
          AGENT: ${{ matrix.agent }}
        run: |
          cd "$RUNNER_TEMP/work"
          set +e
          python3 -m unittest discover -s tests -v > "$RUNNER_TEMP/report/unit-tests.txt" 2>&1
          echo "unit_tests_exit_code=$?" >> "$RUNNER_TEMP/report/runner-status.txt"
          git diff -- field_agent.py field_rules.py tests > "$RUNNER_TEMP/report/code.patch"
          git status --short > "$RUNNER_TEMP/report/git-status.txt"
          python3 - "$RUNNER_TEMP/report/semantic-check.json" <<'PY'
          import json, sys, tempfile
          from pathlib import Path
          from unittest.mock import patch
          result = {'actual_misalignment_blocked': False,
                    'relevant_source_change_possible': False, 'details': []}
          try:
              import field_agent
              def case(name, reason):
                  with tempfile.TemporaryDirectory() as tmp:
                      root=Path(tmp)
                      (root/'field_rules.py').write_text(field_agent.rule_source(1,0),encoding='utf-8')
                      source={'url':'https://arxiv.org/abs/2505.06120','sha256':'bench-fixture','verified_sources':1,'excerpt':'test'}
                      suggestion={'question':('How can we avoid unverified sources?' if name == 'in-scope mechanism' else 'How can we improve multi-turn reliability?'),
                                  'finding':('The current source rule allows proceeding without a primary source.' if name == 'in-scope mechanism' else 'LLMs misinterpret early context'),
                                  'reason':reason,
                                  'proposal':1,
                                  'api_usage':{'total_tokens':0}}
                      with patch.object(field_agent,'read_primary',return_value=source), patch.object(field_agent,'propose_live',return_value=suggestion):
                          value=field_agent.run(root, 'live', source_url=source['url'])
                      return value['adoption']
              wrong=case('observed mismatch', 'Implement a step where users can clarify or re-specify requests after each conversation turn.')
              matched=case('in-scope mechanism','The existing source verification gate currently allows research to proceed on unverified claims. Requiring one independently read primary source before running the research probe directly addresses that failure.')
              result['actual_misalignment_blocked']=wrong!='adopted'
              result['relevant_source_change_possible']=matched=='adopted'
              result['details']=[f'out_of_scope_adoption={wrong}',f'in_scope_adoption={matched}']
          except Exception as error:
              result['details']=[f'evaluation_error={type(error).__name__}: {str(error)[:240]}']
          Path(sys.argv[1]).write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print('INDEPENDENT_EVALUATION='+json.dumps(result,ensure_ascii=False))
          PY
          echo "changed_files:" && cat "$RUNNER_TEMP/report/git-status.txt"
          echo "status:" && cat "$RUNNER_TEMP/report/runner-status.txt"
          echo "patch_lines=$(wc -l < "$RUNNER_TEMP/report/code.patch")"
          echo "sanitized_agent_output_tail:"
          tail -n 14 "$RUNNER_TEMP/report/agent-log-redacted.txt" 2>/dev/null || true
          exit 0
      - name: Store comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trial-${{ matrix.agent }}-stable-20261023
          path: |
            ${{ runner.temp }}/report/runner-status.txt
            ${{ runner.temp }}/report/code.patch
            ${{ runner.temp }}/report/git-status.txt
            ${{ runner.temp }}/report/unit-tests.txt
            ${{ runner.temp }}/report/semantic-check.json
            ${{ runner.temp }}/report/agent-log-redacted.txt
          retention-days: 14
