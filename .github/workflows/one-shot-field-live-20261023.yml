name: One-time GitHub Field Agent live trial

on:
  push:
    branches:
      - experiment/note-to-field-agent-v01
    paths:
      - field-live-probe/once-20261023.txt

permissions:
  contents: write

jobs:
  once:
    if: "github.event.head_commit.message == 'trial: execute GitHub Field Agent once (2026-10-23)'"
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Run one arXiv-backed model decision
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python3 field_agent.py --mode live --source-url https://arxiv.org/abs/2505.06120 --model gpt-4o-mini
      - name: Print measured decision and token usage
        run: |
          python3 - <<'PY'
          import json
          data = json.load(open("field_runs.json", encoding="utf-8"))[-1]
          print("FIELD_RESULT=" + json.dumps({
             k: data[k] for k in ("question", "finding", "reason",
                    "candidate_minimum_verified_sources", "adoption",
                    "decision_before", "decision_after", "api_usage")
          }, ensure_ascii=False))
          PY
      - name: Store observed result as artifact
        uses: actions/upload-artifact@v4
        with:
          name: field-live-20261023
          path: |
            field_runs.json
            field_rules.py
          retention-days: 14
      - name: Persist adopted rule and actual run on experiment branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add field_rules.py field_runs.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record one live field-agent decision'
            git push
          fi
