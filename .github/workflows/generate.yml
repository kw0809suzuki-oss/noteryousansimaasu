name: Generate note drafts
on:
  workflow_dispatch:
    inputs:
      topic:
        description: "記事のテーマ"
        required: true
        default: "暮らしの小さな工夫"
        type: string
      count:
        description: "記事数（最初は1、最大20）"
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "3"
          - "5"
          - "10"
          - "20"

permissions:
  contents: write

concurrency:
  group: draft-generation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Generate drafts
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ARTICLE_TOPIC: ${{ inputs.topic }}
          ARTICLE_COUNT: ${{ inputs.count }}
        run: |
          python3 generate.py --topic "$ARTICLE_TOPIC" --count "$ARTICLE_COUNT"
      - name: Upload drafts as artifact
        uses: actions/upload-artifact@v4
        with:
          name: note-drafts
          path: articles.json
          retention-days: 7
      - name: Commit drafts for review
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add articles.json
          if ! git diff --cached --quiet; then
            git commit -m "Generate note article drafts"
            git push
          fi
